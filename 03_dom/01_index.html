              Head    Body


NodeList -> It's not actually an array but have some properties like array.

HTMLCollection -> It is a built-in object that represents a live collection of HTML elements from the DOM.
An important feature of HTMLCollection is that it's live. If the DOM changes, the collection updates automatically.

HTMLCollection vs NodeList

| Feature             | HTMLCollection           |   NodeList                               |
| ------------------- | -------------------------| -----------------------------------------|
| Live?               | ✅ Usually live          |  ❌ Usually static (`querySelectorAll`) |
| Contains            | Only element nodes       |   Elements, text nodes, etc.             |
| forEach() support   | ❌ No                    |  ✅ Yes                                 |
| Convert to Array    | Array.from(collection)    |  Array.from(nodeList)                   |


-->
